<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>新学期分班查询</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        /* ===== 主卡片 ===== */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 32px 28px 40px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15), 0 8px 24px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .container:hover {
            transform: translateY(-2px);
        }
        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            color: #5e6f7e;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        /* ===== 输入区 ===== */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-group label {
            font-size: 15px;
            font-weight: 500;
            color: #1f2a36;
            margin-left: 4px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-row input {
            flex: 1;
            padding: 16px 18px;
            border: 2px solid #dce4ec;
            border-radius: 20px;
            font-size: 16px;
            background: #ffffff;
            transition: border-color 0.25s, box-shadow 0.25s;
            outline: none;
            color: #1a2a3a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .input-row input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .input-row input::placeholder {
            color: #ff0000;
            font-weight: 500;
            letter-spacing: 0px;
        }
        .input-row button {
            padding: 16px 28px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            white-space: nowrap;
            box-shadow: 0 8px 18px rgba(59, 130, 246, 0.25);
            letter-spacing: 0.5px;
        }
        .input-row button:hover {
            background: #2563eb;
            box-shadow: 0 8px 22px rgba(59, 130, 246, 0.35);
        }
        .input-row button:active {
            transform: scale(0.97);
        }
        /* ===== 结果区 ===== */
        .result-card {
            margin-top: 16px;
            padding: 20px 18px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 6px 18px rgba(0, 20, 40, 0.06);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .result-card .placeholder {
            color: #ff0000;
            font-size: 25px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.7px;
        }
        .result-card .success {
            animation: fadeSlide 0.35s ease;
        }
        .result-card .success .name {
            font-size: 22px;
            font-weight: 700;
            color: #0b1e2e;
            margin-bottom: 6px;
        }
        .result-card .success .class-info {
            font-size: 18px;
            font-weight: 500;
            color: #2563eb;
            background: #eef4ff;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 6px;
        }
        .result-card .success .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eef2f6;
            margin-top: 14px;
            padding-top: 14px;
            font-size: 14px;
            color: #3d5567;
        }
        .result-card .error {
            color: #dc2626;
            font-weight: 500;
            text-align: center;
            font-size: 16px;
            animation: fadeSlide 0.35s ease;
        }
        /* ===== 底部提示 ===== */
        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #8da1b2;
            letter-spacing: 0.2px;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 20px;
        }
        .footer-note span {
            background: #eef2f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 500;
            color: #3b82f6;
        }
        /* ===== 动画 ===== */
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 移动端优化 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 24px 18px 30px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 22px;
            }
            .input-row {
                flex-direction: column;
                gap: 10px;
            }
            .input-row button {
                width: 100%;
                justify-content: center;
                padding: 14px;
            }
            .input-row input {
                width: 100%;
                padding: 14px 16px;
            }
            .result-card .success .name {
                font-size: 20px;
            }
            .result-card .success .class-info {
                font-size: 16px;
            }
        }
        @media (max-width: 380px) {
            .container {
                padding: 18px 14px 24px;
            }
            .header .icon {
                font-size: 38px;
            }
        }
    </style>
</head>

        const id = input.value.trim();
        if (!id) {

                </div>
